<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Form Filler</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <h2>LLM Form Filler by Georges Paul</h2>
  <label id="userPromptLabel" for="userPrompt">Custom Prompt:</label>
  <textarea id="userPrompt"
    placeholder="Instructions for the AI, for example: Bob is the sender of the parcel and Sandra is the recipient."></textarea>
  <div id="visualProcessingSection">
    <label title="Optional extra: also send one screenshot of the visible page to the model on the first look. Slower and more expensive; the form is filled from the page structure either way. Requires a vision-capable model."><input type="checkbox" id="useVisualProcessing"> Also attach a screenshot (optional, slower)</label>
  </div>
  <hr>
  <label id="progressLabel" for="progressBar" style="color: gray;">Filling Progress <span id="elapsedTime"
      style="display: none;">(0s)</span>:</label>
  <div id="progressContainer" class="windows-95-progress" style="opacity: 0.5;">
    <div id="progressBarFill"></div>
  </div>
  <button id="fillForm">Fill Form</button>
  <button id="fillCredentials">Fill User/Pass</button>
  <button id="stopFilling" disabled>Stop Filling</button>
  <div id="needsInput" style="display: none;"></div>

  <div id="profileSelectContainer">
    <div id="profileListHeader">
      <span id="selectedCount">0 profiles selected</span>
      <div id="profileButtons">

      </div>
    </div>
    <select id="profileSelect" multiple size="6">

    </select>
    <div id="profileManagementButtons">
      <button id="showAddProfileForm">Add New</button>
      <button id="removeProfile">Delete Selected</button>
    </div>
    <div id="profileSelectionButtons">
      <button id="selectAllProfiles">Select All Profiles</button>
      <button id="clearAllProfiles">Select None</button>
    </div>
  </div>
  <div id="profileForm">
    <!-- This panel always edits whichever profile is selected: "Add New" creates
         the profile and loads it straight in here. It never was an add form. -->
    <h3 id="formTitle">Edit Selected Profile</h3>
    <form id="dynamicProfileForm"></form>
    <div id="profileFormButtons">
      <button id="addProfileFromTxt">Add profile from text file</button>
      <button id="saveSelectedProfile">Save selected profile to text file</button>
      <button id="backupAllProfiles">Backup everything to text file</button>
      <button id="reloadBackup">Reload backup from text file</button>
    </div>
    <button id="llmConfigButton">LLM API Config</button>
    <button id="keepassConfigButton">KeePass Config</button>
  </div>
  <!-- ff:logs:start -->
  <fieldset id="logsSection" class="win95-groupbox">
    <legend>Fill logs (local only)</legend>
    <div id="logsSummary">No fill logs yet.</div>
    <label title="Record every fill: what the form looked like, what the model was asked and answered, what the extension did, what the page did in response, and what was submitted afterwards. Stored only in this browser."><input type="checkbox" id="logEnabled" checked> Record fill logs</label>
    <label title="Replace profile values with their keys (e.g. &lt;email&gt;) in the exported file."><input type="checkbox" id="logRedact"> Redact profile values on export</label>
    <div id="logButtons">
      <button id="exportLastLog">Export last session</button>
      <button id="exportAllLogs">Export all sessions</button>
      <button id="clearLogs">Clear logs</button>
    </div>
  </fieldset>
  <!-- ff:logs:end -->
  <div id="logLabel">System messages:</div>
  <div id="logMsg"></div>
  <footer>
    <button id="donateButton" class="button donate-button">Donate</button>
    <br>
    <img src="qr-code.png" alt="Donate QR Code" width="150">
    <br><br>
    <a href="https://github.com/GeorgesPaul/formfill" target="_blank">GitHub Repository</a>
  </footer>
  <script src="browserCompat.js"></script>
  <script src="popup.js"></script>
  <script src="apiUtils.js"></script>
  <script src="llmConfig.js"></script>

</body>
