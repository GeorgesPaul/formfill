<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LLM API Configuration</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="llm-config-body">
    <h2 class="llm-config-h2">LLM API Configuration</h2>

    <table id="configTable">
        <thead>
            <tr>
                <th>Name</th>
                <th>API URL</th>
                <th>Model</th>
                <th>API Key</th>
            </tr>
        </thead>
        <tbody>
        </tbody>
    </table>

    <button id="addConfig" class="llm-config-button">Add</button>
    <button id="editConfig" class="llm-config-button">Edit</button>
    <button id="deleteConfig" class="llm-config-button">Delete</button>
    <button id="testApi" class="llm-config-button">Test API</button>

    <form id="configForm">
        <input type="text" id="configName" placeholder="Configuration Name" required>
        <input type="text" id="apiUrl" placeholder="API URL" required>
        <input type="text" id="model" placeholder="Model" required>
        <input type="password" id="apiKey" placeholder="API Key">
        <button type="submit" class="llm-config-button">Save</button>
        <button type="button" id="cancelEdit" class="llm-config-button">Cancel</button>
    </form>

    <div id="statusMessage"></div>

    <div id="logLabel">System messages:</div>
    <div id="logMsg"></div>
    <script src="apiUtils.js"></script>
    <script src="llmConfig.js"></script>
</body>
</html>
